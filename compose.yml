name: sd-book-my-show
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: booking
      POSTGRES_USER: booking_demo
      POSTGRES_PASSWORD: booking_demo
    ports: ["127.0.0.1:5553:5432"]
    volumes: ["booking-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking_demo -d booking"]
      interval: 3s
      timeout: 3s
      retries: 20
    mem_limit: 3g
    memswap_limit: 4g
    cpus: 2.0
  api-a:
    build: .
    environment: &api-env
      DB_URL: jdbc:postgresql://postgres:5432/booking?connectTimeout=3&socketTimeout=5
      DB_USER: booking_demo
      DB_PASSWORD: booking_demo
      INSTANCE_ID: api-a
      MOVIE_SCHEDULE_ENABLED: "true"
    ports: ["127.0.0.1:8130:8105"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck: &api-health
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8105/actuator/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 320m
  api-b:
    build: .
    environment:
      <<: *api-env
      INSTANCE_ID: api-b
    ports: ["127.0.0.1:8131:8105"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck: *api-health
    mem_limit: 320m
volumes:
  booking-data:
