name: sd-book-my-show
services:
  postgres:
    image: postgres:16-alpine
    # Tuned for the 3 GB / 2 CPU limit: ~25% shared buffers, planner told about page cache.
    command: ["postgres", "-c", "shared_buffers=768MB", "-c", "effective_cache_size=2GB",
              "-c", "work_mem=16MB", "-c", "maintenance_work_mem=256MB"]
    # Parallel queries use /dev/shm; Docker's 64 MB default is too small for 16 MB work_mem.
    shm_size: 256mb
    environment:
      POSTGRES_DB: booking
      POSTGRES_USER: booking_demo
      POSTGRES_PASSWORD: booking_demo
    ports: ["127.0.0.1:5553:5432"]
    volumes: ["booking-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking_demo -d booking"]
      interval: 3s
      timeout: 3s
      retries: 20
    mem_limit: 3g
    memswap_limit: 4g
    cpus: 2.0
  api-a:
    build: .
    environment: &api-env
      DB_URL: jdbc:postgresql://postgres:5432/booking?connectTimeout=3&socketTimeout=5
      DB_USER: booking_demo
      DB_PASSWORD: booking_demo
      INSTANCE_ID: api-a
      MOVIE_SCHEDULE_ENABLED: "true"
    ports: ["127.0.0.1:8130:8105"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck: &api-health
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8105/actuator/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m
    cpus: 1.0
  api-b:
    build: .
    environment:
      <<: *api-env
      INSTANCE_ID: api-b
    ports: ["127.0.0.1:8131:8105"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck: *api-health
    mem_limit: 512m
    cpus: 1.0
volumes:
  booking-data:
