server:
  shutdown: graceful
  port: ${PORT:8105}
  tomcat:
    threads:
      max: 32
    max-connections: 100
    accept-count: 32
spring:
  lifecycle:
    timeout-per-shutdown-phase: 15s
  application:
    name: sd-book-my-show
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5553/booking?connectTimeout=3&socketTimeout=5}
    username: ${DB_USER:booking_demo}
    password: ${DB_PASSWORD:booking_demo}
    hikari:
      maximum-pool-size: 8
      connection-timeout: 3000
  jackson:
    deserialization:
      accept-float-as-int: false
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,db
      probes:
        enabled: true
lab:
  outbox-controls-enabled: ${OUTBOX_CONTROLS_ENABLED:false}
  outbox-dispatch-enabled: ${OUTBOX_DISPATCH_ENABLED:true}
  poison-controls-enabled: ${POISON_CONTROLS_ENABLED:false}
  provider-url: ${PROVIDER_URL:}
  failure-controls-enabled: ${FAILURE_CONTROLS_ENABLED:false}
  instance: ${INSTANCE_ID:local}
  maintenance-enabled: ${MAINTENANCE_ENABLED:true}
movie:
  payment-controls-enabled: ${MOVIE_PAYMENT_CONTROLS_ENABLED:false}
  payment-worker-enabled: ${MOVIE_PAYMENT_WORKER_ENABLED:true}
  payment-tick-ms: ${MOVIE_PAYMENT_TICK_MS:200}
