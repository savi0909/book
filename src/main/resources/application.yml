server:
  shutdown: graceful
  port: ${PORT:8105}
  tomcat:
    threads:
      max: 32
    max-connections: 100
    accept-count: 32
spring:
  lifecycle:
    timeout-per-shutdown-phase: 15s
  application:
    name: sd-book-my-show
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5553/booking?connectTimeout=3&socketTimeout=5}
    username: ${DB_USER:booking_demo}
    password: ${DB_PASSWORD:booking_demo}
    hikari:
      maximum-pool-size: 8
      connection-timeout: 3000
  jackson:
    deserialization:
      accept-float-as-int: false
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,db
      probes:
        enabled: true
lab:
  outbox-controls-enabled: ${OUTBOX_CONTROLS_ENABLED:false}
  outbox-dispatch-enabled: ${OUTBOX_DISPATCH_ENABLED:true}
  poison-controls-enabled: ${POISON_CONTROLS_ENABLED:false}
  provider-url: ${PROVIDER_URL:}
  failure-controls-enabled: ${FAILURE_CONTROLS_ENABLED:false}
  instance: ${INSTANCE_ID:local}
  maintenance-enabled: ${MAINTENANCE_ENABLED:true}
movie:
  payment-controls-enabled: ${MOVIE_PAYMENT_CONTROLS_ENABLED:false}
  payment-worker-enabled: ${MOVIE_PAYMENT_WORKER_ENABLED:true}
  payment-tick-ms: ${MOVIE_PAYMENT_TICK_MS:200}
  booking-window-days: ${MOVIE_BOOKING_WINDOW_DAYS:3}
  schedule-enabled: ${MOVIE_SCHEDULE_ENABLED:false}
  schedule-interval-ms: ${MOVIE_SCHEDULE_INTERVAL_MS:900000}
order:
  controls-enabled: ${ORDER_CONTROLS_ENABLED:false}
  operator-token: ${ORDER_OPERATOR_TOKEN:}
  enabled: ${ORDER_SAGA_ENABLED:false}
  worker-enabled: ${ORDER_SAGA_WORKER_ENABLED:true}
  kafka-enabled: ${ORDER_KAFKA_ENABLED:true}
  kafka-bootstrap: ${ORDER_KAFKA_BOOTSTRAP:localhost:9094}
  kafka-group: ${ORDER_KAFKA_GROUP:booking-saga-v1}
  api-token: ${ORDER_API_TOKEN:}
  provider-url: ${ORDER_PROVIDER_URL:http://localhost:8136}
  provider-token: ${ORDER_PROVIDER_TOKEN:}
  poll-ms: ${ORDER_POLL_MS:500}
  batch-size: ${ORDER_BATCH_SIZE:20}
  publish-concurrency: ${ORDER_PUBLISH_CONCURRENCY:10}
  lease-seconds: ${ORDER_LEASE_SECONDS:30}
  broker-timeout-ms: ${ORDER_BROKER_TIMEOUT_MS:5000}
  max-claims: ${ORDER_MAX_CLAIMS:10}
  backoff-base-ms: ${ORDER_BACKOFF_BASE_MS:1000}
  backoff-cap-ms: ${ORDER_BACKOFF_CAP_MS:300000}
  deadline-seconds: ${ORDER_DEADLINE_SECONDS:120}
  step-seconds: ${ORDER_STEP_SECONDS:10}
  max-recovery: ${ORDER_MAX_RECOVERY:10}
  max-payment-attempts: ${ORDER_MAX_PAYMENT_ATTEMPTS:10}
