global
    log stdout format raw local0
    maxconn 256

defaults
    mode http
    log global
    option httplog
    timeout connect 1s
    timeout client 20s
    timeout server 15s
    timeout http-request 5s
    retries 0

resolvers docker
    nameserver docker-dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 1s

frontend booking
    bind :8080
    # Demo controls operate on a specific replica via its loopback port.
    http-request deny deny_status 404 if { path_beg /api/demo/failover }
    default_backend booking_apis

backend booking_apis
    balance roundrobin
    retry-on none
    option httpchk GET /actuator/health/readiness
    http-check expect status 200
    http-reuse never
    default-server inter 500ms fall 1 rise 1 resolvers docker resolve-prefer ipv4 init-addr libc,none
    server api-a api-a:8105 check
    server api-b api-b:8105 check
