server:
  port: 8095
  servlet:
    context-path: /

spring:
  application:
    name: mock-payment-gateway

  datasource:
    url: ${MOCK_PG_DB_URL:jdbc:postgresql://localhost:5553/booking?currentSchema=payment_processor,public}
    username: ${MOCK_PG_DB_USERNAME:booking_demo}
    password: ${MOCK_PG_DB_PASSWORD:booking_demo}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: MockPgPool
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 5000
      idle-timeout: 300000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: payment_processor
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: payment_processor
    baseline-on-migrate: true
    baseline-version: 65
    out-of-order: false

  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    encoding: UTF-8

mock-pg:
  saga-token: ${MOCK_PG_SAGA_TOKEN:}
  webhook-url: ${MOCK_PG_WEBHOOK_URL:http://localhost:8081/api/customer/api/v1/webhooks/payment}
  webhook-secret: ${MOCK_PG_WEBHOOK_SECRET:mock-webhook-secret-dev}
  payment-secret: ${MOCK_PG_PAYMENT_SECRET:mock-payment-secret-dev}
  checkout-base-url: ${MOCK_PG_CHECKOUT_BASE_URL:http://localhost:8095}
  allowed-origins:
    - http://localhost:5173
    - http://localhost:5174
    - http://localhost:8081
    - https://fitpro-ebon-ten.vercel.app
    - https://api.aaztratech.com
    - https://mock-pg.aaztratech.com

server.error:
  include-message: always
  include-stacktrace: always
  include-exception: true

logging:
  level:
    com.aaztra.mockpg: DEBUG
    org.flywaydb: INFO
    org.springframework.web: DEBUG
