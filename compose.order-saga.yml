# Optional reference workflow. Explicit tokens are required; existing stacks are not started by adding this file.
services:
  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,HOST://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,HOST://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx256m
    ports: ["127.0.0.1:9094:9094"]
    volumes: ["order-kafka-data:/var/lib/kafka/data"]
    mem_limit: 768m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
  kafka-topics:
    image: apache/kafka:3.9.1
    depends_on:
      kafka: {condition: service_healthy}
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        for topic in booking.inventory.commands.v1 booking.payment.commands.v1 booking.order.replies.v1 booking.order.events.v1; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic "$$topic" --partitions 3 --replication-factor 1 --config retention.ms=1209600000
        done
    mem_limit: 256m
  mock-payment-gateway:
    build: ./mock-payment-gateway
    environment:
      MOCK_PG_DB_URL: jdbc:postgresql://postgres:5432/booking?currentSchema=payment_processor,public
      MOCK_PG_DB_USERNAME: booking_demo
      MOCK_PG_DB_PASSWORD: booking_demo
      MOCK_PG_SAGA_TOKEN: ${ORDER_PROVIDER_TOKEN:?Set ORDER_PROVIDER_TOKEN}
    ports: ["127.0.0.1:8136:8095"]
    depends_on:
      postgres: {condition: service_healthy}
    mem_limit: 384m
    cpus: 0.5
  api-a:
    environment: &saga-env
      ORDER_SAGA_ENABLED: "true"
      ORDER_API_TOKEN: ${ORDER_API_TOKEN:?Set ORDER_API_TOKEN}
      ORDER_PROVIDER_TOKEN: ${ORDER_PROVIDER_TOKEN:?Set ORDER_PROVIDER_TOKEN}
      ORDER_PROVIDER_URL: http://mock-payment-gateway:8095
      ORDER_KAFKA_BOOTSTRAP: kafka:9092
    depends_on:
      kafka-topics: {condition: service_completed_successfully}
      mock-payment-gateway: {condition: service_healthy}
  api-b:
    environment: *saga-env
    depends_on:
      kafka-topics: {condition: service_completed_successfully}
      mock-payment-gateway: {condition: service_healthy}
volumes:
  order-kafka-data:
